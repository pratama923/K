  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 30% 20%, #2a1a1a, #0b0f1c 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #edf2f7;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ORB BACKGROUND */
    body::before {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      background: #ff4d4d;
      filter: blur(160px);
      opacity: 0.35;
      top: -150px;
      left: -100px;
      border-radius: 50%;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: #4da3ff;
      filter: blur(180px);
      opacity: 0.3;
      bottom: -200px;
      right: -100px;
      border-radius: 50%;
      z-index: 0;
    }

    .orb-middle {
      position: fixed;
      width: 350px;
      height: 350px;
      background: #ff914d;
      filter: blur(150px);
      opacity: 0.2;
      top: 40%;
      left: 30%;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    #app {
      width: 100%;
      max-width: 480px;
      background: rgba(10, 8, 18, 0.65);
      backdrop-filter: blur(14px);
      border-radius: 42px;
      padding: 40px 24px 50px;
      text-align: center;
      position: relative;
      z-index: 10;
      box-shadow:
        0 40px 80px rgba(0,0,0,0.8),
        0 0 40px rgba(255, 77, 77, 0.3),
        0 0 60px rgba(77, 163, 255, 0.25);
    }

    /* PROFILE IMAGE */
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      padding: 4px;
      background: linear-gradient(135deg, #ff4d4d, #4da3ff);
      box-shadow:
        0 0 25px rgba(255, 77, 77, 0.9),
        0 0 45px rgba(77, 163, 255, 0.8),
        0 0 80px rgba(255, 77, 77, 0.4);
      margin-bottom: 20px;
      transition: 0.3s ease;
    }

    .profile-img:hover {
      transform: scale(1.05);
      box-shadow:
        0 0 40px rgba(255, 77, 77, 1),
        0 0 70px rgba(77, 163, 255, 1),
        0 0 120px rgba(77, 163, 255, 0.6);
    }

    /* NAME */
    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b, #60a5fa);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow:
        0 0 20px rgba(255, 107, 107, 0.8),
        0 0 40px rgba(96, 165, 250, 0.6);
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .description {
      font-size: 0.95rem;
      color: #ffdede;
      margin-bottom: 32px;
      padding: 10px 20px;
      background: rgba(40, 20, 30, 0.45);
      border-radius: 50px;
      border: 1px solid rgba(255, 77, 77, 0.3);
    }

    /* SOCIAL ICON */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .social-icons a {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffdede;
      font-size: 1.4rem;
      background: rgba(40, 20, 30, 0.6);
      border: 1px solid rgba(255, 77, 77, 0.3);
      transition: 0.3s;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: #ff4d4d;
      transform: translateY(-6px);
      box-shadow:
        0 0 25px rgba(255, 77, 77, 0.9),
        0 0 40px rgba(77, 163, 255, 0.8);
    }

    /* LINKS */
    .link-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .link-card {
      background: rgba(35, 20, 30, 0.75);
      padding: 18px 24px;
      border-radius: 60px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255, 80, 80, 0.35);
      box-shadow:
        0 0 20px rgba(255, 80, 80, 0.25),
        0 0 35px rgba(80, 140, 255, 0.2);
      transition: 0.3s;
      position: relative;
    }

    .link-card:hover {
      transform: scale(1.03);
      box-shadow:
        0 0 35px rgba(255, 80, 80, 0.9),
        0 0 60px rgba(80, 140, 255, 0.8);
    }

    .link-card i {
      background: linear-gradient(135deg, #ff4d4d, #4da3ff);
      -webkit-background-clip: text;
      color: transparent;
      font-size: 1.3rem;
    }

    footer {
      margin-top: 45px;
      font-size: 0.85rem;
      color: #ffdede;
      padding: 12px 18px;
      background: rgba(40, 20, 30, 0.45);
      border-radius: 100px;
      border: 1px solid rgba(255, 77, 77, 0.3);
    }
  </style>
</head>
